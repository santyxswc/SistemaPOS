[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pos-system"
version = "0.2.0"
description = "Sistema POS modular para negocios pequeños (arquitectura limpia)"
requires-python = ">=3.11"
dependencies = ["Flask>=3.0,<4", "PyJWT>=2.7,<3", "waitress>=3.0,<4", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
